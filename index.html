:root{
  --g:#4A9E6D; --g-deep:#1F4D35; --g-ink:#173A2A; --g-mid:#8CC7A5; --g-soft:#BFE0CC; --g-mint:#E8F4ED; --g-text:#43705A;
  --tan:#F2D9B3; --tan-d:#C99F66;
  --page:#E6F0EA; --ctrl-bg:#FFFFFF; --ctrl-ink:#1F4D35; --ctrl-muted:#5B7F6A; --seg:#CFE3D6; --seg-fill:#4A9E6D; --focus:#1F4D35;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0F2219; --ctrl-bg:#18342A; --ctrl-ink:#E8F4ED; --ctrl-muted:#9CC4AC; --seg:#2B4D3C; --seg-fill:#8CC7A5; --focus:#BFE0CC; }
}
:root[data-theme="dark"]{ --page:#0F2219; --ctrl-bg:#18342A; --ctrl-ink:#E8F4ED; --ctrl-muted:#9CC4AC; --seg:#2B4D3C; --seg-fill:#8CC7A5; --focus:#BFE0CC; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--page); font-family:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; color:var(--ctrl-ink)}
.app{height:100%; display:flex; flex-direction:column; background:var(--page)}
.app[data-mode="build"] .viewport,.app[data-mode="build"] .controls{display:none}
.viewport{position:relative; flex:1 1 auto; min-height:0; overflow:hidden}

/* ---------- stage (fixed 1920 x 1080, scaled) ---------- */
.stage{position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:50% 50%;
  background:#FFFFFF; overflow:hidden; color:var(--g-ink); border-radius:12px; box-shadow:0 40px 90px -50px rgba(23,58,42,.45)}
.stage svg text{font-family:inherit}
.abs{position:absolute}
.brand{position:absolute; left:120px; top:60px; display:flex; align-items:center; gap:14px; font-weight:600; font-size:26px; letter-spacing:-.01em; color:var(--g-deep); z-index:11}
.brand i{display:block; width:34px; height:6px; border-radius:3px; background:var(--g)}
.layer{position:absolute; inset:0}
.scene{position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s linear .6s}
.scene.is-active{opacity:1; visibility:visible; transition:opacity .6s ease}
.scene.is-leaving{opacity:0; visibility:visible; transition:opacity .6s ease}

/* ---------- type roles ---------- */
.tx{position:absolute; margin:0; color:var(--g-ink)}
.tx .in{width:100%}
.tx.vb{display:flex; flex-direction:column; justify-content:flex-end}
.tx.fit{overflow:hidden}
.r-eyebrow{font-size:26px; line-height:1.3; font-weight:500; color:var(--g)}

.r-label{font-size:24px; line-height:1.4; font-weight:500; color:var(--g)}
.r-item{font-size:30px; line-height:1.3; font-weight:500}
.r-body{font-size:28px; line-height:1.38; font-weight:500}
.r-num{font-size:26px; line-height:1.3; font-weight:600; color:var(--g)}
.r-stat{font-size:120px; line-height:1; font-weight:700; color:var(--g); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.r-statement{font-size:46px; line-height:1.26; font-weight:600; letter-spacing:-.02em; padding-left:44px; border-left:6px solid var(--g)}
.r-quote{font-size:50px; line-height:1.32; font-weight:500; letter-spacing:-.02em; padding-left:44px; border-left:6px solid var(--g)}
.arw{display:inline-block; width:1em; height:.6em; vertical-align:.05em}
.arw svg{width:100%; height:100%; display:block; fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.caption{position:absolute; left:120px; bottom:50px; max-width:1500px; margin:0; padding-left:22px; border-left:4px solid var(--g); font-size:28px; line-height:1.4; color:#3A6650; z-index:6}
.ph{background:var(--tan); color:var(--g-ink); border-radius:8px; padding:0 .14em; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.ph.filled{background:none; padding:0}
.app[data-mode="present"] .ph{background:none; padding:0}
.ph[contenteditable]{outline:none; cursor:text}
.ph[contenteditable]:focus{box-shadow:0 0 0 3px var(--g-deep)}
.tx[contenteditable]{outline:none; cursor:text}
.tx[contenteditable]:focus{box-shadow:0 0 0 3px var(--g-soft); border-radius:6px}
.card{position:absolute; background:#FFFFFF; border:2px solid var(--g-soft); border-radius:16px}
.chip{position:absolute; display:flex; align-items:center; justify-content:center; border-radius:24px; font-size:24px; font-weight:500; white-space:nowrap}
.chip.soft{background:var(--g-mint); color:var(--g-deep)}
.chip.solid{background:var(--g); color:#FFFFFF; font-weight:600}
.node{position:absolute; border-radius:50%; background:#FFFFFF; border:3px solid var(--g)}
.node.numd{display:flex; align-items:center; justify-content:center; font-weight:600; color:var(--g)}

.vline{position:absolute; width:3px; background:var(--g-soft); z-index:0}

/* ---------- motion (explainer easing and stagger) ---------- */
.a{opacity:0}
svg .a{transform-box:fill-box; transform-origin:50% 50%}
.scene.is-active .a{animation:rise .9s cubic-bezier(.2,.75,.2,1) both; animation-delay:var(--d,0s)}
.scene.is-active .a.pop{animation-name:pop}
.scene.is-active .a.fade{animation-name:fade; animation-duration:1.1s}
.scene.is-active .a.drop{animation-name:drop; animation-duration:1.1s}
.w{display:inline-block; opacity:0}
.scene.is-active .w{animation:wordIn .7s cubic-bezier(.2,.75,.2,1) both; animation-delay:var(--d,0s)}
.draw{stroke-dasharray:1; stroke-dashoffset:1}
.scene.is-active .draw{animation:draw 1.6s cubic-bezier(.45,.05,.2,1) forwards; animation-delay:var(--d,0s)}
.scene.is-leaving .a,.scene.is-leaving .w{animation:none; opacity:1; transform:none}
.scene.is-leaving .draw{animation:none; stroke-dashoffset:0}
.pulse{opacity:0; transform-box:fill-box; transform-origin:50% 50%}
.scene.is-active .pulse{animation:pulse 2.6s ease-out infinite; animation-delay:var(--d,0s)}
.scene.is-active .march{animation:march 1.4s linear infinite}
.scene.is-active .float{animation:float 6s ease-in-out infinite; animation-delay:var(--fd,0s)}
.scene.is-active .belt{animation:belt 2.6s linear infinite}
@keyframes rise{from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.5)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes drop{from{opacity:0; transform:translateY(-70px)} to{opacity:1; transform:none}}
@keyframes wordIn{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.35); opacity:.85} 100%{transform:scale(1.9); opacity:0}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
@keyframes belt{from{transform:translate(0,0)} to{transform:translate(var(--bx),var(--by))}}
/* static render: thumbnails, editor, reduced motion */
.scene.static .a,.scene.static .w{animation:none !important; opacity:1; transform:none}
.scene.static .draw{animation:none !important; stroke-dashoffset:0}
.scene.static .pulse{display:none}
.scene.static *{animation:none !important}
@media (prefers-reduced-motion: reduce){
  .scene.is-active .a,.scene.is-active .w,.scene.is-active .draw{animation-duration:.01s !important; animation-delay:0s !important}
  .scene.is-active .pulse,.scene.is-active .march,.scene.is-active .float,.scene.is-active .belt{animation:none !important}
  .scene,.scene.is-active,.scene.is-leaving{transition:none}
}

/* ---------- presenter controls ---------- */
.controls{flex:none; width:100%; max-width:1280px; margin:0 auto; padding:10px 16px 14px; display:flex; flex-direction:column; gap:10px; color:var(--ctrl-ink)}
.segs{display:flex; gap:4px; align-items:center; height:16px}
.seg{flex:1 1 0; height:6px; border:0; padding:0; border-radius:3px; background:var(--seg); cursor:pointer; transition:height .15s}
.seg.gap{margin-left:10px}
.seg.done{background:var(--g-mid)}
.seg.on{background:var(--seg-fill)}
.seg:hover{height:10px}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.btn{appearance:none; border:1px solid var(--seg); background:var(--ctrl-bg); color:var(--ctrl-ink); font:500 14px/1 'Poppins',system-ui,sans-serif;
  height:40px; min-width:40px; padding:0 16px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer}
.btn.icon{padding:0; width:40px}
.btn svg{width:18px; height:18px; fill:currentColor; flex:none}
.btn.primary{background:var(--g); border-color:var(--g); color:#FFFFFF}
.btn.sm{height:32px; padding:0 12px; font-size:13px}
.btn.on{background:var(--g-deep); border-color:var(--g-deep); color:#FFFFFF}
.btn:focus-visible,.seg:focus-visible,.thumb:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
.meta-t{font-size:14px; color:var(--ctrl-muted); margin-left:8px; white-space:nowrap}
.spacer{flex:1}
.toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--g-deep); color:#FFFFFF; padding:12px 20px; border-radius:12px; font-size:14px; z-index:50}
.toast[hidden],.confirm[hidden],.editor[hidden],.build[hidden]{display:none}

/* ---------- build mode ---------- */
.build{flex:1; overflow:auto; padding:28px clamp(16px,4vw,48px) 60px; color:#173A2A}

.bk{margin:0 0 4px; font-size:13px; color:#5B7F6A}
.bhead h1{margin:0; font-size:28px; font-weight:600; letter-spacing:-.02em}
.bactions{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.count{font-size:14px; color:#1F4D35; background:#FFFFFF; border:1px solid #CFE3D6; border-radius:20px; padding:9px 14px}
.count.warn{border-color:#C99F66; background:#FBF3E6}
.rules{background:#FFFFFF; border-radius:16px; padding:20px 24px; margin-bottom:28px}

.sc.off{background:#F4F9F6}

    ctx.kind = meta.kind;
    var blocks = D.expand(code, K);
    var cap = blocks.filter(function (b) { return b.t === 'caption'; })[0];
    return '<section class="scene' + (ctx.static ? ' static is-active' : '') + '" data-code="' + esc(code) + '">' +
      blocks.map(function (b, i) { return blockHTML(b, i, code, ctx); }).join('') +
      (cap ? '<p class="caption a" style="--d:1.6s">' + esc(cap.text) + '</p>' : '') + '</section>';
  }
  function fitAll(root) {
    root.querySelectorAll('.tx.fit').forEach(function (el) {
      var max = +el.getAttribute('data-max'), min = +el.getAttribute('data-min'), size = max;
      el.style.fontSize = size + 'px';
      var inner = el.firstElementChild;
      while (size > min && inner.scrollHeight > el.clientHeight + 1) { size -= 2; el.style.fontSize = size + 'px'; }
    });
  }
  function splitWords(root) {
    root.querySelectorAll('.tx.words .in').forEach(function (p) {
      var host = p.parentNode, d0 = parseFloat(getComputedStyle(host).getPropertyValue('--d')) || 0;
      var html = p.innerHTML.split(/(<span class="arw"[\s\S]*?<\/svg><\/span>)/);
      var out = '', k = 0;
      html.forEach(function (part) {
        if (part.indexOf('class="arw"') >= 0) { out += '<span class="w" style="--d:' + (d0 + k++ * 0.09).toFixed(2) + 's">' + part + '</span> '; return; }
        part.split(/\s+/).filter(Boolean).forEach(function (w) { out += '<span class="w" style="--d:' + (d0 + k++ * 0.09).toFixed(2) + 's">' + w + '</span> '; });
      });
      p.innerHTML = out;
      host.classList.remove('a');
    });
  }

  /* ---------- runtime effects on the active slide ---------- */
  var live = { t0: 0, raf: 0, el: null };
  function startEffects(el) {
    live.el = el; live.t0 = performance.now();
    cancelAnimationFrame(live.raf);
    var counts = Array.prototype.slice.call(el.querySelectorAll('[data-count]'));
    var shuttle = el.querySelector('.shuttle'), trucks = [], loop, per, ox, oy, s;
    if (shuttle) {
      loop = JSON.parse(shuttle.getAttribute('data-loop')); ox = +shuttle.getAttribute('data-ox'); oy = +shuttle.getAttribute('data-oy'); s = +shuttle.getAttribute('data-s');
      per = 2 * ((loop[1][0] - loop[0][0]) + (loop[2][1] - loop[1][1]));
      trucks = Array.prototype.slice.call(shuttle.querySelectorAll('.truck'));
    }
    function frame(now) {
      var t = (now - live.t0) / 1000;
      counts.forEach(function (n) {
        var to = +n.getAttribute('data-count'), cd = +n.getAttribute('data-cd');
        var p = reduce ? 1 : Math.max(0, Math.min(1, (t - cd) / 1.3));
        var v = Math.round(to * (1 - Math.pow(1 - p, 3)));
        var txt = v + n.getAttribute('data-suffix');
        var inner = n.firstElementChild;
        if (inner.textContent !== txt) inner.textContent = txt;
      });
      if (trucks.length && !(stagePaused())) {
        var speed = reduce ? 0 : 1.15;
        var order = trucks.map(function (tr, i) {
          var pos = K.loopPos(loop, (i / trucks.length) * per + t * speed);
          var dx = (pos.x - pos.y) * 0.866 * s, dy = (pos.x + pos.y) * 0.5 * s;
          tr.setAttribute('transform', 'translate(' + (ox + dx).toFixed(1) + ',' + (oy + dy).toFixed(1) + ')');
          for (var c = 0; c < tr.children.length; c++) { var v = tr.children[c]; v.style.display = v.getAttribute('data-h') === pos.h ? '' : 'none'; }
          return { tr: tr, depth: pos.x + pos.y };
        }).sort(function (a, b) { return a.depth - b.depth; });
        order.forEach(function (o) { if (shuttle.lastElementChild !== o.tr) shuttle.appendChild(o.tr); });
      }
      if (live.el === el) live.raf = requestAnimationFrame(frame);
    }
    live.raf = requestAnimationFrame(frame);
  }
  function stagePaused() { return false; }

  /* ---------- present mode ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), layer = $('layer'), vp = $('viewport');
  function deckList() { return LIB.filter(function (s) { return state.deck.indexOf(s.code) >= 0 && s.built && s.status !== 'pending'; }).map(function (s) { return s.code; }); }
  function currentCode() { return state.detour ? state.detour.list[state.detour.i] : deckList()[state.idx]; }
  function fit() {
    var w = vp.clientWidth - 24, h = vp.clientHeight - 24;
    var k = Math.max(0.05, Math.min(w / 1920, h / 1080));
    stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
  }
  window.addEventListener('resize', function () { fit(); fitEditor(); document.querySelectorAll('.mini').forEach(function (m) { m.style.setProperty('--k', (m.parentNode.clientWidth / 1920).toFixed(4)); }); });
  document.addEventListener('fullscreenchange', fit);

  function show() {
    var code = currentCode(); if (!code) return;
    var old = layer.querySelector('.scene.is-active');
    if (old) { old.classList.remove('is-active'); old.classList.add('is-leaving'); setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 650); }
    var tmp = document.createElement('div');
    tmp.innerHTML = slideHTML(code, { static: false, edit: false });
    var el = tmp.firstElementChild;
    layer.appendChild(el);
    fitAll(el); splitWords(el);
    void el.offsetWidth;
    el.classList.add('is-active');
    startEffects(el);
    var cap = el.querySelector('.caption');
    updateControls();
  }
  function go(i) { state.detour = null; var n = deckList().length; state.idx = Math.max(0, Math.min(n - 1, i)); show(); }
  function next() {
    if (state.detour) { if (state.detour.i < state.detour.list.length - 1) { state.detour.i++; show(); } else { var back = state.detour.back; state.detour = null; state.idx = back; show(); } return; }
    if (state.idx < deckList().length - 1) { state.idx++; show(); }
  }
  function prev() {
    if (state.detour) { if (state.detour.i > 0) { state.detour.i--; show(); } else { var back = state.detour.back; state.detour = null; state.idx = back; show(); } return; }
    if (state.idx > 0) { state.idx--; show(); }
  }
  function moduleOf(first) { var sec = BY[first].section; return LIB.filter(function (s) { return s.section === sec && /^[A-Z]{1,2}\d$/.test(s.code); }).map(function (s) { return s.code; }); }
  function jump(first) {
    var list = moduleOf(first).filter(function (c) { return BY[c].built && BY[c].status !== 'pending'; });
    if (!list.length) { toast(BY[first].section.charAt(0) + BY[first].section.slice(1).toLowerCase() + ' module has no slides yet.'); return; }
    var dl = deckList(), di = dl.indexOf('OPEN 02');
    var inDeck = list.every(function (c) { return dl.indexOf(c) >= 0; });
    if (inDeck && !state.detour) { state.idx = dl.indexOf(list[0]); state.detour = { list: list, i: 0, back: di, inDeck: true }; show(); return; }
    state.detour = { list: list, i: 0, back: di >= 0 ? di : state.idx };
    show();
  }
  function toDecision() {
    var dl = deckList(), di = dl.indexOf('OPEN 02');
    if (di >= 0) { go(di); return; }
    state.detour = { list: ['OPEN 02'], i: 0, back: state.idx }; show();
  }
  layer.addEventListener('click', function (e) {
    var h = e.target.closest('.hot'); if (!h) return;
    jump(h.getAttribute('data-go'));
  });

  function updateControls() {
    var dl = deckList(), segs = $('segs');
    var activeCode = currentCode();
    var activeIdx = state.detour ? state.detour.back : state.idx;
    if (state.detour && state.detour.inDeck) activeIdx = dl.indexOf(activeCode);
    segs.innerHTML = '';
    var lastSec = null;
    dl.forEach(function (c, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'seg' + (lastSec && BY[c].section !== lastSec ? ' gap' : '') + (i < activeIdx ? ' done' : '') + (i === activeIdx ? ' on' : '');
      b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      b.addEventListener('click', function () { go(i); });
      segs.appendChild(b); lastSec = BY[c].section;
    });
    $('counter').textContent = state.detour && !state.detour.inDeck ? 'Off-deck · ' + (state.detour.i + 1) + ' / ' + state.detour.list.length : (activeIdx + 1) + ' / ' + dl.length;
  }
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))) return;
    if (state.mode !== 'present' || !$('editor').hidden) { if (e.key === 'Escape' && !$('editor').hidden) closeEditor(); return; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') toggleFull();
    else if (e.key === 'd' || e.key === 'D') toDecision();
    else if (/^[1-6]$/.test(e.key) && currentCode() === 'OPEN 02') jump(D.MODULES[+e.key - 1].go);
  });
  $('bPrev').addEventListener('click', prev);
  $('bNext').addEventListener('click', next);
  $('bFull').addEventListener('click', toggleFull);
  $('bBuild').addEventListener('click', function () { setMode('build'); });
  function toggleFull() {
    try { if (!document.fullscreenElement) (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); else (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (err) { }
  }

  /* ---------- build mode ---------- */
  var KIND = { locked: 'Locked', pick: 'Pick-and-use', flex: 'Flexible', internal: 'Internal' };
  function unfilled() {
    var miss = [];
    deckList().forEach(function (c) {
      if (BY[c].kind !== 'flex') return;
      var toks = [];
      D.expand(c, K).forEach(function (b) { if (b.t === 'text' && (!b.opt || b.opt === state.opts.cover)) (b.text.match(/\[[^\]]+\]/g) || []).forEach(function (t) { if (!state.fields[keyOf(t)]) toks.push(t); }); });
      if (toks.length) miss.push({ code: c, toks: toks });
    });
    return miss;
  }
  function renderBuild() {
    var dl = deckList();
    var html = '<header class="bhead"><div><p class="bk">Build mode · internal</p><h1>Gemba sales deck library</h1></div>' +
      '<div class="bactions"><span class="count' + (dl.length < 10 || dl.length > 14 ? ' warn' : '') + '">' + dl.length + ' slides in this deck · aim for 10 to 14</span><button class="btn primary" type="button" id="bPresent">Present this deck</button></div></header>';
    html += '<section class="rules"><h2>Building a client deck</h2><ul>' + D.RULES.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    var warn = [];
    var corePending = LIB.filter(function (s) { return s.section === 'CORE' && s.status === 'pending'; }).map(function (s) { return s.code; });
    if (corePending.length) warn.push('CORE slides are mandatory. ' + corePending.join(' and ') + ' are waiting for content, so no deck is complete yet.');
    var mods = {}; dl.forEach(function (c) { if (/^(O|C|R|Q|SC|V|P)\d$/.test(c)) mods[BY[c].section] = 1; });
    if (Object.keys(mods).length > 2) warn.push('More than two opportunity modules in this deck (' + Object.keys(mods).join(', ') + '). Rule 2 says two at most.');
    var cases = dl.filter(function (c) { return /^PROOF 03/.test(c); }).length, tests = dl.filter(function (c) { return c === 'PROOF 04'; }).length;
    if (cases > 1 || tests > 1) warn.push('Use one case + one testimonial.');
    var miss = unfilled();
    if (miss.length) warn.push('Fields still showing placeholders: ' + miss.map(function (m) { return m.code; }).join(', ') + '.');
    if (warn.length) html += '<div class="warns">' + warn.map(function (w) { return '<p>' + esc(w) + '</p>'; }).join('') + '</div>';
    html += '</section>';
    var sections = [{ id: 'INTERNAL', bg: '#5B7F6A', fg: '#FFFFFF' }].concat(D.SECTIONS);
    sections.forEach(function (sec) {
      var items = LIB.filter(function (s) { return s.section === sec.id; });
      if (!items.length) return;
      html += '<section class="sec"><h2 class="slabel" style="background:' + sec.bg + ';color:' + sec.fg + '">' + esc(sec.id) + '</h2><div class="grid">';
      items.forEach(function (s) {
        var inDeck = dl.indexOf(s.code) >= 0;
        var pend = s.status === 'pending';
        var canToggle = s.built && !pend && s.kind !== 'internal' && s.kind !== 'locked';
        var status = 'Content pending';
        html += '<article class="sc' + (pend ? ' off' : '') + '">' +
          '<button class="thumb" type="button" data-open="' + esc(s.code) + '" aria-label="Open ' + esc(s.code) + '"><div class="mini" data-code="' + esc(s.code) + '"></div></button>' +
          '<div class="meta"><span class="code">' + esc(s.code) + '</span><span class="kind k-' + s.kind + '">' + KIND[s.kind] + '</span>' + (pend ? '<span class="kind k-pend">' + status + '</span>' : '') + '</div>' +
          '<p class="title">' + esc(s.title) + '</p>' +
          (s.notes ? '<ul class="notes">' + s.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
          (s.kind !== 'internal' ? '<label class="tog"><input type="checkbox" data-toggle="' + esc(s.code) + '"' + (inDeck && !pend ? ' checked' : '') + (canToggle ? '' : ' disabled') + '> ' + (pend ? 'Available once content arrives' : s.kind === 'locked' ? 'In every deck' : 'In this deck') + '</label>' : '') +
          '</article>';
      });
      html += '</div></section>';
    });
    var b = $('build');
    b.innerHTML = html;
    var paint = function (m) { if (m.getAttribute('data-done')) return; m.setAttribute('data-done', '1'); m.innerHTML = slideHTML(m.getAttribute('data-code'), { static: true, edit: false }); m.style.setProperty('--k', (m.parentNode.clientWidth / 1920).toFixed(4)); fitAll(m); };
    if ('IntersectionObserver' in window && !params.get('eager')) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { paint(e.target); io.unobserve(e.target); } }); }, { root: b, rootMargin: '400px' });
      b.querySelectorAll('.mini').forEach(function (m) { io.observe(m); });
    } else b.querySelectorAll('.mini').forEach(paint);
    $('bPresent').addEventListener('click', function () {
      var m = unfilled();
      if (m.length) { confirmBox('Some fields still show placeholders (' + m.map(function (x) { return x.code; }).join(', ') + '). Clients will see the brackets.', 'Present anyway', function () { setMode('present', true); }); return; }
      setMode('present', true);
    });
    b.querySelectorAll('[data-toggle]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var c = cb.getAttribute('data-toggle');
        if (cb.checked) state.deck.push(c); else state.deck = state.deck.filter(function (x) { return x !== c; });
        renderBuild();
      });
    });
    b.querySelectorAll('[data-open]').forEach(function (t) { t.addEventListener('click', function () { openEditor(t.getAttribute('data-open')); }); });
  }
  function setMode(m, restart) {
    state.mode = m;
    $('app').setAttribute('data-mode', m);
    $('build').hidden = m !== 'build';
    if (m === 'build') { renderBuild(); window.scrollTo(0, 0); }
    else { if (restart) state.idx = 0; state.detour = null; fit(); show(); }
  }

  /* ---------- editor (one slide, full size) ---------- */
  var edCode = null;
  function openEditor(code) {
    edCode = code;
    var s = BY[code], spec = D.SPECS[code];
    var bar = '<div class="edbar"><div><span class="code">' + esc(code) + '</span> <span class="kind k-' + s.kind + '">' + KIND[s.kind] + '</span><p class="edhint">' +
      (s.kind === 'flex' ? 'Click a highlighted field and type. Text shrinks to fit its box.' : s.kind === 'locked' ? 'Locked slide. Only the options below can change.' : s.kind === 'pick' ? 'Pick-and-use slide. Finished artwork; add it or leave it out.' : 'Internal slide. Never shown to clients.') + '</p></div><div class="edopts">';
    if (spec.options && spec.options.cover) bar += '<span class="ol">Headline</span>' + ['A', 'B'].map(function (o) { return '<button type="button" class="btn sm' + (state.opts.cover === o ? ' on' : '') + '" data-cover="' + o + '">Option ' + o + '</button>'; }).join('');
    if (spec.selectors && spec.selectors.indexOf('geo') >= 0) bar += '<span class="ol">Geography emphasis</span>' + ['', 'India', 'Middle East', 'Africa'].map(function (g) { return '<button type="button" class="btn sm' + (state.opts.geo === g ? ' on' : '') + '" data-geo="' + g + '">' + (g || 'None') + '</button>'; }).join('');
    if (spec.tag) bar += '<span class="ol">Industry</span><span class="ph">' + esc(spec.tag.industry) + '</span>' + (spec.tag.client ? '<span class="ol">Client</span><span class="ph">' + esc(spec.tag.client) + '</span>' : '');
    bar += '<button type="button" class="btn primary" id="edDone">Done</button></div></div>';
    var ed = $('editor');
    ed.innerHTML = bar + '<div class="edvp" id="edvp"><div class="stage edstage" id="edstage"><div class="brand"><i></i>Gemba Concepts</div><div class="layer"></div></div></div>';
    ed.hidden = false;
    paintEditor();
    ed.querySelectorAll('[data-cover]').forEach(function (bt) { bt.addEventListener('click', function () { state.opts.cover = bt.getAttribute('data-cover'); openEditor(code); }); });
    ed.querySelectorAll('[data-geo]').forEach(function (bt) { bt.addEventListener('click', function () { state.opts.geo = bt.getAttribute('data-geo'); openEditor(code); }); });
    $('edDone').addEventListener('click', closeEditor);
  }
  function paintEditor() {
    var st = $('edstage'), lay = st.querySelector('.layer');
    lay.innerHTML = slideHTML(edCode, { static: true, edit: true });
    fitEditor();
    fitAll(lay);
    lay.querySelectorAll('[contenteditable]').forEach(function (el) {
      el.addEventListener('focus', function () { if (el.classList.contains('ph') && !el.classList.contains('filled')) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && el.classList.contains('ph')) { e.preventDefault(); el.blur(); } });
      el.addEventListener('input', function () {
        if (el.classList.contains('ph')) {
          var k = el.getAttribute('data-k'), lim = LIMITS[k] || 70, v = el.textContent;
          if (v.length > lim) { v = v.slice(0, lim); el.textContent = v; }
          var clean = v.trim();
          if (clean && clean !== el.getAttribute('data-ph')) state.fields[k] = clean; else delete state.fields[k];
          el.classList.toggle('filled', !!state.fields[k]);
        } else if (el.getAttribute('data-bk')) {
          state.blocks[el.getAttribute('data-bk')] = el.innerText.replace(/\n+$/, '');
        }
        var host = el.closest('.tx.fit'); if (host) fitAll(host.parentNode);
      });
      el.addEventListener('blur', function () {
        if (el.classList.contains('ph') && !el.classList.contains('filled')) el.textContent = el.getAttribute('data-ph');
      });
    });
  }
  function fitEditor() {
    var vpE = $('edvp'), st = $('edstage'); if (!vpE || !st || $('editor').hidden) return;
    var k = Math.min((vpE.clientWidth - 24) / 1920, (vpE.clientHeight - 24) / 1080);
    st.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
  }
  function closeEditor() { $('editor').hidden = true; edCode = null; if (state.mode === 'build') renderBuild(); }

  /* ---------- small UI helpers ---------- */
  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
  function confirmBox(msg, ok, fn) {
    var c = $('confirm');
    c.innerHTML = '<div class="cbox" role="dialog" aria-modal="true"><p>' + esc(msg) + '</p><div class="crow"><button class="btn" type="button" id="cNo">Fill them in</button><button class="btn primary" type="button" id="cYes">' + esc(ok) + '</button></div></div>';
    c.hidden = false;
    $('cNo').onclick = function () { c.hidden = true; };
    $('cYes').onclick = function () { c.hidden = true; fn(); };
    $('cYes').focus();
  }

  /* ---------- boot ---------- */
  fit();
  if (params.get('mode') === 'build') setMode('build');
  else {
    var start = params.get('slide');
    if (start) { var i = deckList().indexOf(start); if (i >= 0) state.idx = i; else if (BY[start] && BY[start].built) state.detour = { list: [start], i: 0, back: 0 }; }
    show();
  }
  window.__gemba = { state: state, show: show, setMode: setMode, openEditor: openEditor };
})();

</script>
</body>
